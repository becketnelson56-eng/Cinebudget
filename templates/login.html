<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinebudget — Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
  <div class="login-container">
    <div class="login-logo">
      <span class="login-logo-mark">CB</span>
    </div>
    <h1 class="login-title">Cinebudget</h1>
    <p class="login-subtitle">Production Budget Intelligence</p>

    <form class="login-form" method="POST" action="{{ url_for('login') }}">
      {% if error %}
      <div class="login-error">{{ error }}</div>
      {% endif %}

      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          autocomplete="username"
          autofocus
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          required
        >
      </div>

      <button type="submit" class="btn-primary btn-full">Sign In</button>
    </form>
  </div>
</body>
</html>
